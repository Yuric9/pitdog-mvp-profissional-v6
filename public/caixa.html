<!doctype html><html lang="pt-BR"><head>
<link rel="stylesheet" href="/theme.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pit Dog • Caixa</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f5;color:#18181b;font-family:Inter,system-ui,sans-serif;font-weight:800}header{background:#18181b;color:#fff;padding:16px 20px;border-bottom:4px solid #f97316;display:flex;justify-content:space-between;gap:12px;align-items:center}main{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:3px solid #18181b;border-radius:18px;padding:16px;box-shadow:4px 4px #18181b}.big{font-size:28px}.section{margin-top:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:3px solid #18181b;border-radius:14px;padding:13px 18px;background:#fff;font-weight:900;cursor:pointer}.primary{background:#f97316}.success{background:#86efac}.danger{background:#f87171}.muted{color:#71717a;font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:#fff;border:3px solid #18181b;border-radius:18px;padding:18px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}.field input,.field select{padding:12px;border:2px solid #18181b;border-radius:10px;font-weight:800;font-size:16px}.msg{margin:12px 0;padding:12px;border-radius:12px;background:#dcfce7;border:2px solid #166534}.error{background:#fee2e2;border-color:#991b1b}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}main{padding:12px}}
</style>
<style id="pitdog-professional-theme">
:root{--pd-primary:#1f4b72;--pd-primary-dark:#173a59;--pd-success:#15803d;--pd-danger:#b42318;--pd-bg:#f4f6f8;--pd-border:#d7dde3;--pd-text:#17212b;--pd-muted:#66727e}
body{background:var(--pd-bg);color:var(--pd-text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:500}
header{background:#fff;color:var(--pd-text);border-bottom:1px solid var(--pd-border);padding:14px 20px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
header .muted{color:var(--pd-muted)!important}
main{max-width:1180px;padding:24px 20px}.card,.panel{border:1px solid var(--pd-border);border-radius:10px;box-shadow:0 1px 3px rgba(15,23,42,.06);padding:18px;background:#fff}.big{font-size:26px;font-weight:700}.muted{color:var(--pd-muted);font-weight:500}.btn{border:1px solid #cbd3db;border-radius:8px;padding:11px 16px;background:#fff;color:var(--pd-text);font-weight:700;box-shadow:none}.primary{background:var(--pd-primary);border-color:var(--pd-primary);color:#fff}.success{background:#ecfdf3;border-color:#a7d8b7;color:#166534}.danger{background:#fff1f0;border-color:#e5aaa5;color:#991b1b}.field input,.field select{padding:11px;border:1px solid #cbd3db;border-radius:8px;font-weight:500;font-size:15px}.section{margin-top:18px}.msg{padding:11px;border-radius:8px;background:#ecfdf3;border:1px solid #a7d8b7}.error{background:#fff1f0;border-color:#e5aaa5}
h2{font-size:16px;font-weight:700;margin:0 0 12px}.actions{gap:8px}
</style>
</head><body><header class="pd-header"><div class="pd-header-inner"><div class="pd-brand"><div class="pd-logo">🌭</div><div>PIT DOG</div></div><nav class="pd-nav"><a href="/">PDV</a><a class="active" href="/caixa.html">Caixa</a><a href="/estoque.html">Estoque</a></nav></div></header><main>
<div id="msg" hidden></div><div class="grid"><div class="card"><div class="muted">STATUS</div><div id="status" class="big">—</div></div><div class="card"><div class="muted">SALDO INICIAL</div><div id="inicial" class="big">R$ 0,00</div></div><div class="card"><div class="muted">VENDAS</div><div id="vendas" class="big">R$ 0,00</div></div><div class="card"><div class="muted">SALDO ESPERADO</div><div id="saldo" class="big">R$ 0,00</div></div></div>
<div class="row section"><section class="panel"><h2>Operação</h2><div id="abrirBox"><div class="field"><label>Saldo inicial</label><input id="saldoInicial" type="number" min="0" step="0.01" value="0"></div><button class="btn primary" onclick="abrir()">ABRIR CAIXA</button></div><div id="operarBox" hidden><div class="actions"><button class="btn success" onclick="mov('SUPRIMENTO')">+ SUPRIMENTO</button><button class="btn danger" onclick="mov('SANGRIA')">− SANGRIA</button><button class="btn" onclick="fechar()">FECHAR CAIXA</button></div></div></section>
<section class="panel"><h2>Recebimentos</h2><div class="muted">Pedidos são recebidos pelo PDV e registrados automaticamente aqui.</div><div id="formas" style="margin-top:14px"></div></section></div>
<div class="panel section"><h2>Pedidos em aberto</h2><div id="pedidos">Carregando...</div></div><div class="panel section"><h2>Resumo por forma</h2><div id="resumo">Nenhum caixa aberto.</div></div></main>
<script>
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const msg=(t,err=false)=>{let e=document.querySelector('#msg');e.textContent=t;e.className=err?'error':'';e.hidden=false;setTimeout(()=>e.hidden=true,3500)};
async function api(url,opt){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}
async function load(){try{let d=await api('/caixa');document.querySelector('#status').textContent=d.aberto?'ABERTO':'FECHADO';document.querySelector('#abrirBox').hidden=d.aberto;document.querySelector('#operarBox').hidden=!d.aberto;document.querySelector('#inicial').textContent=brl(d.caixa?.saldo_inicial);let venda=(d.resumo||[]).filter(x=>x.forma).reduce((s,x)=>s+Number(x.total||0),0);document.querySelector('#vendas').textContent=brl(venda);let dinheiro=(d.resumo||[]).filter(x=>x.forma==='DINHEIRO').reduce((s,x)=>s+Number(x.total||0),0);let esperado=Number(d.caixa?.saldo_inicial||0)+dinheiro;document.querySelector('#saldo').textContent=brl(esperado);document.querySelector('#resumo').innerHTML=d.aberto?(d.resumo||[]).map(x=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd"><span>${x.forma}</span><span>${brl(x.total)} (${x.quantidade})</span></div>`).join('')||'Sem movimentações':'Nenhum caixa aberto.';let pedidos=await api('/pedidos?status=ABERTOS&limite=50');document.querySelector('#pedidos').innerHTML=pedidos.length?pedidos.map(p=>`<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #ddd"><div><b>#${p.id} • ${p.mesa_numero||'BALCÃO'}</b><div class="muted">${p.status} • ${brl(p.total)}</div></div><button class="btn primary" onclick="receber(${p.id},${Number(p.total||0)})" ${!d.aberto?'disabled':''}>RECEBER</button></div>`).join(''):'Nenhum pedido em aberto.'}catch(e){msg(e.message,true)}}
async function receber(id,total){let forma=(prompt(`Pedido #${id} • ${brl(total)}\nForma: DINHEIRO, PIX ou CARTAO`,'DINHEIRO')||'').toUpperCase();if(!['DINHEIRO','PIX','CARTAO'].includes(forma))return msg('Forma inválida.',true);let pago=total;if(forma==='DINHEIRO'){pago=Number(prompt(`Total ${brl(total)}\nValor recebido:`,'')||0);if(pago<total)return msg('Valor recebido insuficiente.',true)}try{let r=await api(`/pedidos/${id}/fechar`,{method:'POST',body:JSON.stringify({forma,valor_pago:pago})});msg(`Pedido #${id} recebido. Troco: ${brl(r.troco)}`);load()}catch(e){msg(e.message,true)}}
async function abrir(){try{await api('/caixa/abrir',{method:'POST',body:JSON.stringify({saldo_inicial:Number(document.querySelector('#saldoInicial').value||0)})});msg('Caixa aberto.');load()}catch(e){msg(e.message,true)}}
async function mov(tipo){let valor=prompt(`${tipo==='SANGRIA'?'Valor da sangria':'Valor do suprimento'}:`);if(valor===null)return;let forma=tipo==='SANGRIA'?'DINHEIRO':(prompt('Forma: DINHEIRO, PIX ou CARTAO','DINHEIRO')||'DINHEIRO').toUpperCase();try{await api('/caixa/movimentar',{method:'POST',body:JSON.stringify({tipo,forma,valor:Number(valor)})});msg('Movimentação registrada.');load()}catch(e){msg(e.message,true)}}
async function fechar(){let d=await api('/caixa');if(!d.aberto)return;let conf=prompt(`Saldo esperado: ${brl((d.caixa?.saldo_inicial||0)+(d.resumo||[]).filter(x=>x.forma==='DINHEIRO').reduce((s,x)=>s+Number(x.total||0),0))}\nInforme o saldo contado no caixa:`);if(conf===null)return;try{let r=await api('/caixa/fechar',{method:'POST',body:JSON.stringify({saldo_conferido:Number(conf)})});msg(`Caixa fechado. Diferença: ${brl(r.diferenca)}`);load()}catch(e){msg(e.message,true)}}
load();setInterval(load,5000);
</script></body></html>
