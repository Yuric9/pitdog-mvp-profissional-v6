<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pit Dog • Estoque</title><link rel="stylesheet" href="/theme.css"></head><body>
<header class="pd-header"><div class="pd-header-inner"><div class="pd-brand"><div class="pd-logo">🌭</div><div>PIT DOG</div></div><nav class="pd-nav"><a href="/">PDV</a><a href="/caixa.html">Caixa</a><a class="active" href="/estoque.html">Estoque</a></nav></div></header>
<main class="pd-main"><div class="pd-toolbar"><div><h1 class="pd-page-title">Estoque</h1><p class="pd-page-subtitle">Controle de produtos, entradas, saídas e ajustes.</p></div><div class="pd-actions"><button class="pd-btn" onclick="load()">Atualizar</button></div></div>
<div id="msg" hidden></div><div class="pd-grid pd-grid-4" style="margin-bottom:14px"><div class="pd-panel"><div class="pd-kpi-label">Produtos controlados</div><div id="kpiControlados" class="pd-kpi-value">—</div></div><div class="pd-panel"><div class="pd-kpi-label">Em estoque</div><div id="kpiPositivos" class="pd-kpi-value">—</div></div><div class="pd-panel"><div class="pd-kpi-label">Estoque zerado</div><div id="kpiZerados" class="pd-kpi-value">—</div></div><div class="pd-panel"><div class="pd-kpi-label">Sem controle</div><div id="kpiSemControle" class="pd-kpi-value">—</div></div></div>
<section class="pd-panel"><div class="pd-toolbar"><div class="pd-field" style="margin:0;min-width:260px"><label for="busca">Produto</label><input id="busca" placeholder="Buscar produto..." oninput="render()"></div><label style="display:flex;gap:7px;align-items:center;font-size:13px;font-weight:650"><input id="baixo" type="checkbox" onchange="load()"> Mostrar zerados</label></div><div style="overflow:auto"><table class="pd-table"><thead><tr><th>Produto</th><th>Preço</th><th>Controle</th><th>Saldo</th><th>Status</th><th style="width:260px">Ação</th></tr></thead><tbody id="lista"><tr><td colspan="6">Carregando...</td></tr></tbody></table></div></section></main>
<script>
let produtos=[];const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const msg=(t,error=false)=>{const e=document.querySelector('#msg');e.textContent=t;e.className='pd-alert'+(error?' error':'');e.hidden=false;setTimeout(()=>e.hidden=true,3000)};
async function api(u,o){const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});const j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}
async function load(){try{produtos=await api('/estoque'+(document.querySelector('#baixo').checked?'?baixo=1':''));render()}catch(e){msg(e.message,true)}}
function render(){const q=document.querySelector('#busca').value.trim().toLowerCase();const list=produtos.filter(p=>p.nome.toLowerCase().includes(q));const control=produtos.filter(p=>Number(p.controla_estoque));document.querySelector('#kpiControlados').textContent=control.length;document.querySelector('#kpiPositivos').textContent=control.filter(p=>Number(p.saldo)>0).length;document.querySelector('#kpiZerados').textContent=control.filter(p=>Number(p.saldo)<=0).length;document.querySelector('#kpiSemControle').textContent=produtos.length-control.length;document.querySelector('#lista').innerHTML=list.length?list.map(p=>{const saldo=Number(p.saldo||0);return `<tr><td><strong>${esc(p.nome)}</strong></td><td>${brl(p.preco)}</td><td>${Number(p.controla_estoque)?'<span class="pd-badge pd-badge-ok">Controlado</span>':'<span class="pd-badge">Não controlado</span>'}</td><td><strong>${saldo}</strong></td><td>${!Number(p.controla_estoque)?'<span class="pd-badge">N/A</span>':saldo<=0?'<span class="pd-badge pd-badge-danger">Zerado</span>':'<span class="pd-badge pd-badge-ok">Disponível</span>'}</td><td><button class="pd-btn pd-btn-primary" onclick="mov(${p.id},'ENTRADA')">Entrada</button> <button class="pd-btn" onclick="mov(${p.id},'SAIDA')">Saída</button> <button class="pd-btn" onclick="mov(${p.id},'AJUSTE')">Ajustar</button></td></tr>`}).join(''):'<tr><td colspan="6">Nenhum produto encontrado.</td></tr>'}
async function mov(id,tipo){const p=produtos.find(x=>Number(x.id)===id);if(!p)return;let qtd=0,novo;if(tipo==='AJUSTE'){novo=prompt(`Novo saldo para ${p.nome}:`,String(p.saldo||0));if(novo===null)return;if(Number(novo)<0)return msg('Saldo inválido.',true)}else{qtd=prompt(`${tipo==='ENTRADA'?'Quantidade de entrada':'Quantidade de saída'} para ${p.nome}:`,'1');if(qtd===null)return;if(Number(qtd)<=0)return msg('Quantidade inválida.',true)}try{await api('/estoque/movimentar',{method:'POST',body:JSON.stringify({produto_id:id,tipo,qtd:Number(qtd)||undefined,novo_saldo:tipo==='AJUSTE'?Number(novo):undefined})});msg('Movimentação registrada.');load()}catch(e){msg(e.message,true)}}load();
</script></body></html>
